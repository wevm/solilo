name: Package preview

on:
  workflow_call:

permissions:
  contents: read

jobs:
  preview:
    if: github.repository == 'wevm/solilo' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: wevm/actions/vendor/pnpm/action-setup/v6@73e899a58d51092d694fbaf94b7a1d8c09bfea28

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.1"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Build package and WASM
        run: pnpm run build

      - name: Validate packed package
        run: pnpm run test:build

      - name: Publish preview
        # The caller waits for Verify. Upload once per PR/main event, not per matrix job.
        # The pkg.pr.new App handles comments; no repository write token or secrets.
        run: pnpm exec pkg-pr-new publish --pnpm --previewVersion --no-compact --comment=update --commentWithSha --commentWithDev --packageManager=pnpm .
